[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fan-ssh"
version = "0.1.0"
description = "Loopback-only direct SSH transport research prototype"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<51"]

[project.scripts]
fan-ssh = "fan_ssh.cli:main"
directssh = "fan_ssh.cli:main"

[tool.setuptools.packages.find]
include = ["fan_ssh*"]
